name: TokenLogin 1.21.11 build
on:
  push:
    branches: ["chatgpt-tokenlogin-1.21.11"]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.0'
      - name: Build
        run: gradle build
      - name: Save JAR to branch
        run: |
          mkdir -p artifact
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' | head -n 1)
          cp "$JAR" artifact/TokenLogin-1.21.11-E.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifact/TokenLogin-1.21.11-E.jar
          git commit -m "ci: attach TokenLogin 1.21.11-E jar"
          git push
