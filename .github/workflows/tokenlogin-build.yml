name: TokenLogin 1.21.11 build
on:
  push:
    branches: ["chatgpt-tokenlogin-1.21.11"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.0'
      - name: Build
        run: gradle build
      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: TokenLogin-1.21.11-E
          path: build/libs/*.jar
