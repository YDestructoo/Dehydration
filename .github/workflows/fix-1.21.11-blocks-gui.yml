name: fix-1.21.11-blocks-gui

on:
  push:
    branches:
      - fix/1.21.11-ci
    paths:
      - '.github/workflows/fix-1.21.11-blocks-gui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.21.11-ci
          fetch-depth: 0
      - run: python3 scripts/fix_1_21_11_blocks_and_gui.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'port: update block and GUI APIs for Minecraft 1.21.11'
          git push origin HEAD:fix/1.21.11-ci
