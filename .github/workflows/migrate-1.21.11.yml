name: migrate-1.21.11

on:
  push:
    branches:
      - port/1.21.11
    paths:
      - '.github/workflows/migrate-1.21.11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: port/1.21.11
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Save 1.21.11 build properties
        run: cp gradle.properties /tmp/gradle.properties.1.21.11

      - name: Switch project mappings back to source version
        run: git show origin/1.21:gradle.properties > gradle.properties

      - name: Migrate Yarn mappings from 1.21.1 to 1.21.11
        run: ./gradlew migrateMappings --mappings 'net.fabricmc:yarn:1.21.11+build.6' --stacktrace

      - name: Apply migrated sources
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d remappedSrc/main/java ]; then
            cp -a remappedSrc/main/java/. src/main/java/
          elif [ -d remappedSrc ]; then
            find remappedSrc -maxdepth 3 -type f | head -100
            cp -a remappedSrc/. src/
          else
            echo 'Loom did not create remappedSrc; checking for in-place changes.'
          fi
          cp /tmp/gradle.properties.1.21.11 gradle.properties

      - name: Commit migrated sources
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src gradle.properties
          if git diff --cached --quiet; then
            echo 'No migration changes produced.'
            exit 0
          fi
          git commit -m 'port: migrate Yarn mappings to 1.21.11'
          git push origin HEAD:port/1.21.11
