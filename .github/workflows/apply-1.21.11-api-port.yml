name: apply-1.21.11-api-port

on:
  push:
    branches:
      - fix/1.21.11-ci
    paths:
      - '.github/workflows/apply-1.21.11-api-port.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/1.21.11-ci
          fetch-depth: 0

      - name: Apply 1.21.11 source migration
        run: python3 scripts/apply_1_21_11_api_port.py

      - name: Commit migrated source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src
          if git diff --cached --quiet; then
            echo 'No migration changes produced.'
            exit 0
          fi
          git commit -m 'port: update core APIs for Minecraft 1.21.11'
          git push origin HEAD:fix/1.21.11-ci
